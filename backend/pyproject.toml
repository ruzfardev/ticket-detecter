[project]
name = "ticket-detector-backend"
version = "0.1.0"
description = "Multi-user Telegram bot + Mini App for eticket.railway.uz ticket monitoring"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Farrukh Ruzmetov" }]

dependencies = [
    # Web framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",

    # Database
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.27",   # alembic dependency, async metadata

    # HTTP client (railway.uz + telegram api)
    "httpx>=0.27.0",

    # Telegram bot
    "aiogram>=3.4.0",

    # Auth
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",

    # Logging
    "structlog>=24.1.0",

    # Metrics
    "prometheus-client>=0.20.0",

    # Misc
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.3",       # retry/backoff
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "httpx>=0.27.0",          # for TestClient
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "RUF"]
ignore = ["E501"]   # handled by formatter

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
